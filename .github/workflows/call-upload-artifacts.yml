name: "Build And Upload Release Artifacts"
on:
  workflow_call:
    secrets:
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true
      STORE_PASSWORD:
        required: true
      KEYSTORE_BASE64:
        required: true
jobs:
  build_and_upload_release_artifacts:
    name: "Build And Upload ${{ matrix.platform }} Release"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: "android"
            gradle_task: ":instances:androidApp:assembleRelease"
            apk_path: "instances/androidApp/build/outputs/apk/release"
            bundle_path: ""
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Set Up JDK 21"
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: "Set Up Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: "Make gradlew Executable"
        run: chmod +x gradlew
      - name: "Assemble Signed ${{ matrix.platform }} Release"
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: ./gradlew ${{ matrix.gradle_task }} --stacktrace
      - name: "Upload ${{ matrix.platform }} Release To Run Artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: |
            ${{ matrix.apk_path }}
            ${{ matrix.bundle_path }}
