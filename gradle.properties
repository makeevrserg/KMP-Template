# Android
android.enableJetifier=true
android.useAndroidX=true
# Kapt
kapt.incremental.apt=false
kapt.use.worker.api=false
# klibs
klibs.android.sdk.compile=37
klibs.android.sdk.min=23
klibs.android.sdk.target=37
klibs.java.ktarget=21
klibs.java.source=11
klibs.java.target=21
klibs.project.description=Template for KMP applcation
klibs.project.developers=makeevrserg|Makeev Roman|makeevrserg@gmail.com
klibs.project.group=com.makeevrserg.applicationtemplate
klibs.project.name=ApplicationTemplate
klibs.project.url=https://github.com/makeevrserg/KMP-Template
klibs.project.version.code=40
klibs.project.version.string=1.8.0
klibs.publish.developers=makeevrserg|Makeev Roman|makeevrserg@gmail.com
# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
kotlin.incremental=true
kotlin.mpp.androidSourceSetLayoutVersion=2
# Gradle
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true
org.gradle.isolated-projects=false
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.jetbrains.compose.ios.resources.sync=false
# Test
testTask.ignoreFailures=false
